<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="../.././src/input.css" rel="stylesheet">
    <link rel="stylesheet" href="../.././src/output.css">
    
</head>
<body class="bg-background-secondary text-text min-h-screen">

<main class="min-h-screen flex items-center justify-center px-6 py-12">

    <section class="max-w-5xl w-full bg-primary rounded-3xl p-8 md:p-16 shadow-xl">

        <!-- Etiqueta de campaña -->
        <span class="inline-block bg-accent text-primary px-5 py-2 rounded-full text-sm font-bold mb-8">
            Nuevo · Jueves a sábado
        </span>

        <!-- Título -->
        <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-6 tracking-tight">
            Rueda <span class="text-accent">Nocturna</span>
        </h1>

        <!-- Subtítulo -->
        <p class="text-lg md:text-xl text-white/80 max-w-2xl leading-relaxed mb-12">
            Descubre Medellín en bici cuando se encienden las luces
        </p>

        <!-- Datos destacados -->
        <div class="flex flex-wrap gap-12 mb-12">

            <div>
                <p class="text-3xl font-bold text-white">
                    3 rutas
                </p>
                <p class="text-sm text-white/70 mt-2">
                    Para descubrir la ciudad
                </p>
            </div>

            <div>
                <p class="text-3xl font-bold text-accent">
                    Desde $55.000
                </p>
                <p class="text-sm text-white/70 mt-2">
                    Vive la experiencia
                </p>
            </div>

        </div>

        <!-- Inscripción -->
        <a href="#inscripcion"
            class="inline-flex items-center gap-3 bg-accent hover:bg-white text-primary font-bold px-8 py-4 rounded-lg transition duration-300">

            Inscríbete

            <span class="text-xl">→</span>

        </a>

    </section>

</main>

</body> 
</html>
