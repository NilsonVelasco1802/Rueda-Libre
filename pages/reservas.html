<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reservas.css">
</head>

<body>

    <header class="header-principal">
        
        <nav class="nav-principal">
            <a href="../index.html" class="logo">
                <img src="../img/logo1.png" alt="Logo de Rueda Libre">
            </a>
            <menu id="menu-header">
                <li>
                    <a href="../index.html">Inicio</a>
                </li>
                <li> 
                    <a href="./tarifas.html">
                        Tarifas
                    </a>
                </li>
                <li>
                    <a href="./reservas.html">
                        Reserva
                    </a>
                </li>
            </menu>
        </nav>
    </header>

    <main>

        <section id="reserva-formulario">
            <h1>Reserva tu bicicleta</h1>

            <form action="#" method="post">

                <fieldset>
                    <legend>Datos Comprador</legend>

                    <p>Ingresa tus datos</p>

                    <p>
                        <label for="nombre">Nombre Completo</label>
                        <br>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                            minlength="3">
                    </p>

                    <p>
                        <label for="documento">Número de documento:</label>
                        <br>
                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            inputmode="numeric"
                            pattern="[0-9]{6,10}"
                            minlength="6"
                            maxlength="10"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            placeholder="Ingrese su documento"
                            required>
                    </p>

                    <p>
                        <label for="correo">Correo</label>
                        <br>
                        <input
                            type="email"
                            id="correo"
                            name="correo">
                    </p>

                    <p>
                        <label for="telefono">Telefono</label>
                        <br>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            required
                            pattern="[0-9],{10}"
                            title="Esccribe almenos 10 numeros">
                    </p>

                    <p>
                        <label for="fecha">Fecha del alquiler:</label>
                        <br>
                        <input
                            type="date"
                            id="fecha"
                            name="fecha"
                            min="2026-11-01"
                            max="2026-12-31"
                            required>
                    </p>

                </fieldset>

                <fieldset>
                    <legend>Datos Bicicleta</legend>

                    <h2>Escoge tu bicicleta</h2>
                    <br>

                    <p>
                        <label for="bicicleta">Tipo de bicicleta:</label>
                        <br>
                        <select id="bicicleta" name="bicicleta" required>
                            <option value="" disabled selected>Seleccione una bicicleta</option>
                            <option value="montaña">Montaña</option>
                            <option value="ruta">Ruta</option>
                            <option value="urbana">Urbana</option>
                            <option value="electrica">Eléctrica</option>
                        </select>
                    </p>

                    <p>
                        <label for="plan">Plan de alquiler:</label>
                        <br>
                        <select id="plan" name="plan" required>
                            <option value="" disabled selected>Seleccione un plan</option>
                            <option value="hora">Por horas</option>
                            <option value="dia">Por día</option>
                            <option value="semana">Por semana</option>
                        </select>
                    </p>

                    <p>
                        <label for="cantidad">Cantidad de bicicletas:</label>
                        <br>
                        <input
                            type="number"
                            id="cantidad"
                            name="cantidad"
                            min="1"
                            max="6"
                            step="1"
                            required>
                    </p>

                    <p>
                        <label for="comentarios">Comentarios:</label>
                        <br>
                        <textarea
                            id="comentarios"
                            name="comentarios"
                            maxlength="300"
                            placeholder="Escriba sus comentarios (opcional)"></textarea>
                    </p>

                    <p>
                        <input
                            type="checkbox"
                            id="politicas"
                            name="politicas"
                            value="aceptadas"
                            required>

                        <label for="politicas">Acepto las políticas de alquiler</label>
                    </p>

                </fieldset>
                <button id="button-reservas" type="submit">Enviar formulario</button>
            </form>
        </section>

    </main>

    <footer class="footer-principal">
        <nav id="nav-footer">

        <a href="./correo.html">Nuestro Correo y Horarios</a>
        </nav>
    </footer>

</body>
