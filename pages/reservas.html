<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    
</head>
<body>
    <menu>
    <a href="/index.html"><h3>Inicio</h3></a>
    <a href="tarifas.html">
        <h3>Tarifas</h3>
    </a>
    <br>
    
    </a>
</menu>

<section>
    <form action="#" method="post">
        <h1>Reserva tu bicicleta</h1>

        <fieldset>
            <legend>Datos Comprador</legend>
            <br>
            <legend>ingresa tus datos</legend>
            <p>
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required minlength="3">
            </p>
            <label for="documento">Número de documento:</label>
            <input
                type="text"
                id="documento"
                name="documento"
                inputmode="numeric"
                pattern="[0-9]{6,10}"
                minlength="6"
                maxlength="10"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                placeholder="Ingrese su documento"
                required>
            <p>
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo">
            </p>
            <p>
                <label for="telefono">Telefono</label>
                <input type="tel" id="telefono" name="telefono" required pattern="[0-9],{10}"
                title="Escibre almenos 10 numeros">
            </p>
            <p>
                <label for="fecha">Fecha del alquiler:</label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    min="2026-11-01"
                    max="2026-12-31"
                    required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Datos Bicicleta</legend>
            <h3>Escoge tu bicicleta</h3>

            <p>
                <label for="bicicleta">Tipo de bicicleta:</label>
                <select id="bicicleta" name="bicicleta" required>
                    <option value="" disabled selected>Seleccione una bicicleta</option>
                    <option value="montaña">Montaña</option>
                    <option value="ruta">Ruta</option>
                    <option value="urbana">Urbana</option>
                    <option value="electrica">Eléctrica</option>
                </select>
                <br><br>

                <label for="plan">Plan de alquiler:</label>
                <select id="plan" name="plan" required>
                    <option value="" disabled selected>Seleccione un plan</option>
                    <option value="hora">Por horas</option>
                    <option value="dia">Por día</option>
                    <option value="semana">Por semana</option>
                </select>
            </p>
            <p>
                <label for="cantidad">Cantidad de bicicletas:</label>
                <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    min="1"
                    max="6"
                    step="1"
                    required>
            </p>
            <p>
                <label for="comentarios">Comentarios:</label>
                <textarea
                    id="comentarios"
                    name="comentarios"
                    maxlength="300"
                    placeholder="Escriba sus comentarios (opcional)">
                </textarea>
            </p>

            <p>
                <input
                    type="checkbox"
                    id="politicas"
                    name="politicas"
                    value="aceptadas"
                    required>

                <label for="politicas">Acepto las políticas de alquiler</label>
            </p>

        </fieldset>
        <br>
        <button type="submit">Enviar formulario</button>
    </form>
</section>
<br>
<footer>
        <a href="encuentranos.html">Encuentranos</a><br>
        <a href="https://maps.app.goo.gl/HRqvATrAugZNDYvh9">Ubicacion</a><br>
        <a href="correo.html">Nuestro Correo y Horarios</a>
    </footer>
    
    
</body>
</html>
