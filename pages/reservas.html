            </menu>
        </nav>
    </header>

    <main id="main-reservas">

        <section id="reserva-formulario">
            <h1>Formulario de Reserva</h1>

            <form id="formulario" action="#" method="post">

                <fieldset>
                    <legend> Tus Datos</legend>


                    <p>
                        <label for="nombre"> Tu Nombre Completo</label>
                        <br>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                            minlength="3">
                    </p>

                    

                    <p>
                        <label for="correo">Correo</label>
                        <br>
                        <input
                            type="email"
                            id="correo"
                            name="correo">
                    </p>

                    <p>
                        <label for="telefono">Telefono</label>
                        <br>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            maxlength="10"
                            required
                            pattern="[0-9]{10}"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            title="Esccribe almenos 10 numeros">
                    </p>

                    <p>
                        <label for="documento">Número de documento:</label>
                        <br>
                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            inputmode="numeric"
                            pattern="[0-9]{6,10}"
                            minlength="6"
                            maxlength="10"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            required>
                    </p>


                </fieldset>

                <fieldset>
                    <legend> Tu alquiler</legend>

                    <p>
                        <label for="fecha">Fecha del alquiler:</label>
                        <br>
                        <input
                            type="date"
                            id="fecha"
                            name="fecha"
                            min="2026-11-01"
                            max="2026-12-31"
                            required>
                    </p>
                    
                    <br>

                    <p>
                        <label for="bicicleta">Tipo de bicicleta:</label>
                        <br>
                        <select id="bicicleta" name="bicicleta" required>
                            <option value="" disabled selected>Seleccione una bicicleta</option>
                            <option value="montaña">Montaña</option>
                            <option value="ruta">Ruta</option>
                            <option value="urbana">Urbana</option>
                            <option value="electrica">Eléctrica</option>
                        </select>
                    </p>

                    <p>
                        <label for="plan">Plan de alquiler:</label>
                        <br>
                        <select id="plan" name="plan" required>
                            <option value="" disabled selected>Seleccione un plan</option>
                            <option value="hora">Por horas</option>
                            <option value="dia">Por día</option>
                            <option value="semana">Por semana</option>
                        </select>
                    </p>

                    <p>
                        <label for="plan">Recorrido guiado:</label>
                        <br>
                        <select id="plan" name="plan" required>
                            <option value="" disabled selected>Seleccione un recorrido</option>
                            <option value="lugar">Ningunos</option>
                            <option value="lugar">Medellín</option>
                            <option value="lugar">Norte</option>
                            <option value="lugar">Sur</option>
                        </select>
                    </p>
                    <p>
                        <label for="cantidad">Cantidad de bicicletas:</label>
                        <br>
                        <input
                            type="number"
                            id="cantidad"
                            name="cantidad"
                            min="1"
                            max="6"
                            step="1"
                            required>
                            
                    </p>

                    <p>
                        <label for="comentarios">Comentarios:</label>
                        <br>
                        <textarea
                            id="comentarios"
                            name="comentarios"
                            maxlength="300"
                            placeholder="Escriba sus comentarios (opcional)"></textarea>
                    </p>

                    <p id="contenedor-politicas">
                        <br>
                        

                        <label for="politicas">Acepto las políticas de alquiler</label>
                        <input id="politicas-checkbox"
                            type="checkbox"
                            id="politicas"
                            name="politicas"
                            value="aceptadas"
                            required>
                    </p>

                </fieldset>
                <button id="button-reservas" type="submit">Enviar formulario</button>
            </form>
        </section>

    </main>
