<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <nav>
            <menu>
                <li>
                    <a id="menu-header" href="/index.html">Inicio</a>
                </li>
                <li>
                    <a id="menu-header" href="tarifas.html">Tarifa</a>
                </li>
            </menu>
        </nav>
    </header>

    <main>

        <section>
            <h1>Reserva tu bicicleta</h1>

            <form action="#" method="post">

                <fieldset>
                    <legend>Datos Comprador</legend>

                    <p>Ingresa tus datos</p>

                    <p>
                        <label for="nombre">Nombre Completo</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                            minlength="3">
                    </p>

                    <p>
                        <label for="documento">Número de documento:</label>
                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            inputmode="numeric"
                            pattern="[0-9]{6,10}"
                            minlength="6"
                            maxlength="10"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            placeholder="Ingrese su documento"
                            required>
                    </p>

                    <p>
                        <label for="correo">Correo</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo">
                    </p>

                    <p>
                        <label for="telefono">Telefono</label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            required
                            pattern="[0-9],{10}"
                            title="Esccribe almenos 10 numeros">
                    </p>

                    <p>
                        <label for="fecha">Fecha del alquiler:</label>
                        <input
                            type="date"
                            id="fecha"
                            name="fecha"
                            min="2026-11-01"
                            max="2026-12-31"
                            required>
                    </p>

                </fieldset>

                <fieldset>
                    <legend>Datos Bicicleta</legend>

                    <h2>Escoge tu bicicleta</h2>

                    <p>
                        <label for="bicicleta">Tipo de bicicleta:</label>
                        <select id="bicicleta" name="bicicleta" required>
                            <option value="" disabled selected>Seleccione una bicicleta</option>
                            <option value="montaña">Montaña</option>
                            <option value="ruta">Ruta</option>
                            <option value="urbana">Urbana</option>
                            <option value="electrica">Eléctrica</option>
                        </select>
                    </p>

                    <p>
                        <label for="plan">Plan de alquiler:</label>
                        <select id="plan" name="plan" required>
                            <option value="" disabled selected>Seleccione un plan</option>
                            <option value="hora">Por horas</option>
                            <option value="dia">Por día</option>
                            <option value="semana">Por semana</option>
                        </select>
                    </p>

                    <p>
                        <label for="cantidad">Cantidad de bicicletas:</label>
                        <input
                            type="number"
                            id="cantidad"
                            name="cantidad"
                            min="1"
                            max="6"
                            step="1"
                            required>
                    </p>

                    <p>
                        <label for="comentarios">Comentarios:</label>
                        <textarea
                            id="comentarios"
                            name="comentarios"
                            maxlength="300"
                            placeholder="Escriba sus comentarios (opcional)"></textarea>
                    </p>

                    <p>
                        <input
                            type="checkbox"
                            id="politicas"
                            name="politicas"
                            value="aceptadas"
                            required>

                        <label for="politicas">Acepto las políticas de alquiler</label>
                    </p>

                </fieldset>

                <button type="submit">Enviar formulario</button>

            </form>
        </section>

    </main>

    <footer>
        <nav>
            <a id="menu-footer" href="encuentranos.html">Encuentranos</a>
            <br>

            <a id="menu-footer" href="https://maps.app.goo.gl/HRqvATrAugZNDYvh9">Ubicacion</a>
            <br>

            <a id="menu-footer" href="correo.html">Nuestro Correo y Horarios</a>
        </nav>
    </footer>

</body>

</html>
